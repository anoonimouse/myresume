<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Udit Chand Narayan - M.Tech student at IIT Jodhpur. Resume, publications, and professional certifications.">
    <title>Udit Chand Narayan - Resume & Credentials</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --border-color: #26293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(96, 165, 250, 0.03);
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--bg-color);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Udit Chand Narayan</h1>
        <p class="subtitle">M.Tech Student @ IIT Jodhpur</p>

        <div class="links-list">
            <a id="resume-link" href="resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                View Resume (PDF)
            </a>
            
            <a id="cdac-cert-link" href="cdac_certificate.pdf" target="_blank" rel="noopener noreferrer" class="btn">
                CDAC Security Certification
            </a>
            
            <a id="python-cert-link" href="python_certificate.pdf" target="_blank" rel="noopener noreferrer" class="btn">
                Python Certification
            </a>
        </div>

        <div class="footer">
            <p>Back to <a id="github-profile-link" href="https://github.com/anoonimouse" target="_blank" rel="noopener noreferrer">GitHub Profile</a></p>
        </div>
    </div>
</body>
</html>
